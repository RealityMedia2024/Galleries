      <a-entity id="welcome_txt" position="-4.79101 2.1 -0.417" rotation="0 90 0">
        <a-entity position="0 0.2 0" text="color: white; align: center; letterSpacing: 5; lineHeight: 55; 
        value: Welcome to Reality Media; 
        baseline: top; width: 3; anchor: left; wrapCount: 55;">
        </a-entity>
        <a-entity  text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; 
        value: Reality Media is a project encompassing three writing spaces, three technologies for representing ideas: print, the web, and immersive VR. The printed page is a writing space with a tradition dating back to the fifteenth century (in Europe, much earlier in China). Obviously the web has a far shorter tradition, beginning around 1990. But in the thirty year since Tim Berners-Lee launched the first web server, the web has grown to rival print for many kinds of communication. The technologies for creating 3D graphic spaces in VR (and AR) actually predate the web. But only in the past 10 years have AR and VR become widely available media. The goal of RealityMedia is to demonstrate the potential range of AR and VR as communicative forms.; 
        width: 3; anchor: left; wrapCount: 65;">
        </a-entity>
    </a-entity>

    <a-entity id="Overview" position="-4.79101 2.1 -4.386" rotation="0 90 0">
     
      <a-entity  text="color: white; letterSpacing: 5; baseline: top; lineHeight: 55; 
      value: Each gallery in this “immersive book” corresponds to one or more chapters in the printed book and illustrates the themes of the printed chapter(s). (See the map on the far wall for the names/themes of the galleries.) For example, the gallery entitled “Presence” illustrates both presence and the related concept of aura and how computer scientists as well as filmmakers and designers have tried to evoke these reactions in visitors to their immersive applications.; 
      width: 3; anchor: left; wrapCount: 65">
      </a-entity>
  </a-entity>

      <a-entity  position="0.86611 0.2 0" text="color: white; align: left; letterSpacing: 5; lineHeight: 55;

  <script>
    // Continuous position check
    setInterval(function () {
      var userPosition = document
        .getElementById("cameraRig")
        .getAttribute("position");
      if ((userPosition.z <= -7 && userPosition.z > -9)&& (userPosition.x <= 56 && userPosition.x > 54)) {
      //back to onboarding:  Move the user to a new position
      document
          .getElementById("cameraRig")
          .setAttribute("position", "0 0 0");
        document.getElementById("cameraRig").setAttribute("rotation", "0 0 0");
     }
      if (userPosition.z <= -13) {
        // In the onbording: Move the user to a new position
        document
          .getElementById("cameraRig")
          .setAttribute("position", "52.320 3 -8.300");
        document.getElementById("cameraRig").setAttribute("rotation", "0 90 0");
       
        // window.open("presence.html", "_blank");
      }
      
      if ((userPosition.z <= -1.4 && userPosition.z > -1.5)&& (userPosition.x <= 52 && userPosition.x > 51.4)) {

        document

          .setAttribute("position", "52.320 3 -8.300");
        document.getElementById("cameraRig").setAttribute("rotation", "0 90 0");
